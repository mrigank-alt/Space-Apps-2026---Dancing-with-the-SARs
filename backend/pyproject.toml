[project]
name = "groundsignal-boundary-api"
version = "0.1.0"
description = "FastAPI geometry validation for Groundsignal farm selections"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pyproj>=3.7,<4.0",
  "shapely>=2.0,<3.0",
  "uvicorn[standard]>=0.34,<1.0",
  "numpy>=1.26",
  "rasterio>=1.4",
  "PyYAML>=6.0",
  "zarr>=3.0,<4",
]

[project.optional-dependencies]
test = ["httpx>=0.28,<1.0", "pytest>=8.3,<10.0"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = [".."]
testpaths = ["tests"]
